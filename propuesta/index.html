<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Propuesta ficha 2.0 · Taludes DIGER</title>
<link rel="icon" href="../icon-192.png">
<!-- DEMO de la propuesta de ficha 2.0. NO está conectada a nada: no lee ni escribe la base, no usa config.js, no registra
     service worker. Usa la MISMA hoja de estilos y el mismo marcado del formulario de la app (app.js: dibujarFormulario /
     dibujarCampo) para que se vea igual. Ficha y cálculo: ficha2-schema.js. El service worker de la app no guarda esta carpeta. -->
<link rel="stylesheet" href="../styles.css">
<style>
  /* Solo lo nuevo de la 2.0 (la calificación); todo lo demás viene de styles.css */
  .demo-aviso { background: #fff4d6; border: 1px solid #e6c46a; border-radius: var(--radio); padding: 10px 12px; font-size: .82rem; margin-bottom: 14px; }
  .calif { border: 1.5px solid var(--borde); border-radius: var(--radio); background: #fbfdfe; padding: 12px; }
  .calif table { width: 100%; border-collapse: collapse; font-size: .82rem; font-variant-numeric: tabular-nums; }
  .calif td, .calif th { padding: 5px 4px; border-bottom: 1px solid var(--borde); text-align: left; vertical-align: top; }
  .calif td:last-child, .calif th:last-child { text-align: right; white-space: nowrap; font-weight: 700; }
  .calif .tot td { font-weight: 800; color: var(--azul); }
  .calif-ind { font-size: .78rem; color: var(--texto-suave); margin: 8px 0 0; }
  .calif-adv { background: #fff4d6; border-left: 4px solid #e6a100; border-radius: 6px; padding: 8px 10px; font-size: .8rem; margin-top: 10px; }
  .calif-adv ul { margin: 4px 0 0; padding-left: 18px; }
  .sugerida { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; font-size: .86rem; font-weight: 700; }
  .sugerida .chip { font-size: .8rem; padding: 5px 12px; }
  .ficha-topbar .chip { flex: none; }
  .resultado { border: 2px solid var(--azul); border-radius: var(--radio); background: #fff; padding: 12px; margin-top: 12px; font-size: .86rem; }
  .resultado textarea { min-height: 90px; }
  .resultado .botones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .resultado .botones a, .resultado .botones button { flex: 1 1 140px; text-align: center; text-decoration: none; }
</style>
</head>
<body>
<section id="vista-ficha" class="vista pantalla-completa">
  <div class="ficha-topbar">
    <div class="ficha-topbar-titulo">
      <strong>Ficha de evaluación 2.0 · DEMO</strong>
      <span>Propuesta para revisión · no se guarda ni se envía</span>
    </div>
    <span class="chip gris" id="chip-top" title="Prioridad sugerida por el sistema">—</span>
  </div>
  <div id="barra-progreso"><div id="barra-progreso-relleno"></div></div>
  <form id="form-ficha" autocomplete="off" onsubmit="return false">
    <div class="demo-aviso"><b>Demostración de la ficha 2.0.</b> Llénela con un caso hipotético y observe cómo el sistema sugiere la prioridad
      (arriba a la derecha y en las secciones 6 y 7). No está conectada a la base: nada se guarda ni se envía.</div>
  </form>
  <div class="ficha-pie">
    <p id="msg-validacion" class="msg-error"></p>
    <button type="button" id="btn-enviar-ficha" class="btn-principal">Finalizar (demostración)</button>
    <div id="resultado" class="resultado" hidden></div>
  </div>
</section>

<script src="ficha2-schema.js" charset="utf-8"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const D = {};               // respuestas
let ultimaSug = null, fotos = {};
const campos = []; FICHA2.secciones.forEach((s) => s.campos.forEach((c) => campos.push(Object.assign({ sec: s }, c))));
const pad = (n) => String(n).padStart(2, '0');
const ahora = new Date();
D.fecha_hora_visita = ahora.getFullYear() + '-' + pad(ahora.getMonth() + 1) + '-' + pad(ahora.getDate()) + 'T' + pad(ahora.getHours()) + ':' + pad(ahora.getMinutes());
D.codigo_evaluacion = 'DEMO-2.0';

function cumple(cond) {
  if (!cond) return true;
  if (Array.isArray(cond)) return cond.every(cumple);
  // Mientras no se responde la pregunta 1, la ficha se muestra completa (como si hubiera movimiento).
  if (cond.campo === 'hay_movimiento' && !D.hay_movimiento) return cond.valor !== 'No';
  const v = D[cond.campo], arr = Array.isArray(v) ? v : (v ? [v] : []);
  if (cond.valor !== undefined) return v === cond.valor;
  if (cond.valores) return cond.valores.includes(v);
  if (cond.distintoDe !== undefined) return arr.length > 0 && !arr.includes(cond.distintoDe);
  if (cond.contiene) return arr.some((x) => cond.contiene.includes(x));
  return true;
}
const visible = (c) => cumple(c.sec.soloSi) && cumple(c.soloSi);

// ---------------------------------------------------------------- dibujar (mismo marcado que la app)
function dibujarCampo(c) {
  const div = document.createElement('div');
  div.className = 'campo ancho-completo';
  div.dataset.campo = c.id;
  const etq = '<label class="campo-etiqueta">' + esc(c.etiqueta) + (c.unidad ? ' (' + esc(c.unidad) + ')' : '') + (c.requerido ? ' <span class="req">*</span>' : '') + '</label>' +
    (c.ayuda ? '<p class="campo-ayuda">' + esc(c.ayuda) + '</p>' : '');
  if (c.tipo === 'texto' && c.soloLectura) {
    div.innerHTML = etq + '<div class="valor-fijo">' + esc(D[c.id]) + '</div>';
  } else if (c.tipo === 'texto' || c.tipo === 'numero' || c.tipo === 'fecha_hora') {
    div.innerHTML = etq + '<input type="' + (c.tipo === 'fecha_hora' ? 'datetime-local' : 'text') + '"' + (c.tipo === 'numero' ? ' inputmode="decimal"' : '') + ' value="' + esc(D[c.id] || '') + '">';
    div.querySelector('input').addEventListener('input', (e) => { let v = e.target.value; if (c.tipo === 'numero') { v = v.replace(',', '.').replace(/[^0-9.]/g, ''); e.target.value = v; } set(c.id, v); });
  } else if (c.tipo === 'textarea') {
    div.innerHTML = etq + '<textarea></textarea>';
    div.querySelector('textarea').addEventListener('input', (e) => set(c.id, e.target.value));
  } else if (c.tipo === 'municipio') {
    div.innerHTML = etq + '<select><option value="">Selecciona el municipio</option>' + c.opciones.map((m) => '<option>' + esc(m) + '</option>').join('') + '</select>';
    div.querySelector('select').addEventListener('change', (e) => set(c.id, e.target.value));
  } else if (c.tipo === 'unica' || c.tipo === 'multiple' || c.tipo === 'prioridad') {
    const multiple = c.tipo === 'multiple';
    const clase = c.destacado || c.descripciones ? 'opciones opciones-destacadas' : 'opciones';
    let pre = '';
    if (c.tipo === 'prioridad') pre = '<div class="sugerida">Prioridad sugerida por el sistema: <span class="chip gris" id="chip-sug">—</span></div>';
    div.innerHTML = etq + pre + '<div class="' + clase + '">' + c.opciones.map((op) => {
      const desc = c.descripciones && c.descripciones[op] ? '<em>' + esc(c.descripciones[op]) + '</em>' : '';
      return '<label class="opcion"><input type="' + (multiple ? 'checkbox' : 'radio') + '" name="' + c.id + '" value="' + esc(op) + '"><span>' + esc(op) + desc + '</span></label>';
    }).join('') + '</div><div class="detalles"></div>';
    const caja = div.querySelector('.detalles');
    const pintarDetalles = () => {
      const activos = [...div.querySelectorAll('.opciones input:checked')].map((x) => x.value);
      let h = Object.keys(c.detalles || {}).filter((op) => activos.includes(op)).map((op) => {
        const d = c.detalles[op];
        return '<div class="detalle" data-detalle="' + d.id + '"><label class="campo-etiqueta">' + esc(d.etiqueta) + ' <span class="req">*</span></label><input type="text" data-id="' + d.id + '" value="' + esc(D[d.id] || '') + '" placeholder="Escribe aquí"></div>';
      }).join('');
      if (c.tipo === 'prioridad' && FICHA_NIV.includes(D._sug) && D.prioridad && D.prioridad !== D._sug) {
        const sube = FICHA_NIV.indexOf(D.prioridad) > FICHA_NIV.indexOf(D._sug);
        h += '<div class="detalle" data-detalle="justificacion_motivo"><label class="campo-etiqueta">¿Por qué ' + (sube ? 'SUBE' : 'BAJA') + ' la prioridad de ' + D._sug + ' a ' + D.prioridad + '? <span class="req">*</span></label>' +
          '<select data-id="justificacion_motivo"><option value="">Selecciona el motivo</option>' + c.justificacion.motivos.map((m) => '<option' + (D.justificacion_motivo === m ? ' selected' : '') + '>' + esc(m) + '</option>').join('') + '</select></div>' +
          '<div class="detalle" data-detalle="justificacion_texto"><label class="campo-etiqueta">Justificación técnica (mínimo ' + c.justificacion.minimo + ' caracteres) <span class="req">*</span></label><textarea data-id="justificacion_texto">' + esc(D.justificacion_texto || '') + '</textarea></div>';
      }
      caja.innerHTML = h;
      caja.querySelectorAll('[data-id]').forEach((el) => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => set(el.dataset.id, el.value, true)));
    };
    div._pintarDetalles = pintarDetalles;
    div.querySelectorAll('.opciones input').forEach((inp) => inp.addEventListener('change', () => {
      if (multiple) {
        let arr = [...div.querySelectorAll('.opciones input:checked')].map((x) => x.value);
        const ex = c.exclusivas || [];
        if (inp.checked && ex.includes(inp.value)) arr = [inp.value]; else if (inp.checked) arr = arr.filter((x) => !ex.includes(x));
        div.querySelectorAll('.opciones input').forEach((x) => { x.checked = arr.includes(x.value); });
        set(c.id, arr);
      } else set(c.id, inp.value);
      pintarDetalles();
    }));
  } else if (c.tipo === 'gps') {
    div.innerHTML = etq + '<div class="gps-caja"><button type="button" class="btn-secundario btn-gps">Capturar mi ubicación</button>' +
      '<div class="gps-coords"><label>Latitud (Y)<input type="text" inputmode="decimal" class="gps-y" placeholder="4.8123456"></label>' +
      '<label>Longitud (X)<input type="text" inputmode="decimal" class="gps-x" placeholder="-75.7012345"></label>' +
      '<label>Altitud (Z m)<input type="text" inputmode="decimal" class="gps-z" placeholder="1487"></label></div><p class="gps-estado">Sin coordenadas todavía.</p></div>';
    const lee = () => set(c.id, { y: div.querySelector('.gps-y').value, x: div.querySelector('.gps-x').value, z: div.querySelector('.gps-z').value });
    div.querySelectorAll('.gps-coords input').forEach((i) => i.addEventListener('input', lee));
    div.querySelector('.btn-gps').addEventListener('click', () => {
      const est = div.querySelector('.gps-estado');
      if (!navigator.geolocation) { est.textContent = 'Este navegador no da la ubicación: escríbala a mano.'; return; }
      est.textContent = 'Buscando la ubicación…';
      navigator.geolocation.getCurrentPosition((p) => {
        div.querySelector('.gps-y').value = p.coords.latitude.toFixed(7); div.querySelector('.gps-x').value = p.coords.longitude.toFixed(7);
        div.querySelector('.gps-z').value = p.coords.altitude ? Math.round(p.coords.altitude) : '';
        est.textContent = 'Coordenadas registradas (precisión ' + Math.round(p.coords.accuracy) + ' m).'; est.className = 'gps-estado ok'; lee();
      }, () => { est.textContent = 'No se pudo obtener la ubicación: escríbala a mano.'; }, { enableHighAccuracy: true, timeout: 15000 });
    });
  } else if (c.tipo === 'fotos') {
    div.innerHTML = etq + '<div class="fotos-caja"><div class="fotos-acciones">' +
      '<label class="fotos-btn">Tomar foto<input type="file" accept="image/*" capture="environment" hidden></label>' +
      '<label class="fotos-btn alterno">Elegir de la galería<input type="file" accept="image/*" multiple hidden></label></div><p class="fotos-conteo"></p></div>';
    div.querySelectorAll('input[type=file]').forEach((i) => i.addEventListener('change', () => {
      fotos[c.id] = (fotos[c.id] || []).concat([...i.files]);
      div.querySelector('.fotos-conteo').textContent = fotos[c.id].length + ' foto(s) (en la demo no se suben)';
      set(c.id, fotos[c.id].length);
    }));
  } else if (c.tipo === 'responsables') {
    div.innerHTML = etq + [0, 1, 2].map((i) => '<div class="responsable-caja" data-i="' + i + '"><h4>RESPONSABLE ' + (i + 1) + (i === 0 ? ' (obligatorio)' : ' (opcional)') + '</h4>' +
      '<label>Nombre<input type="text" class="r-nombre"></label><label>Tarjeta profesional<input type="text" class="r-tp"></label><label>Entidad<input type="text" class="r-entidad"></label></div>').join('');
    div.querySelectorAll('input').forEach((i) => i.addEventListener('input', () => set(c.id, [...div.querySelectorAll('.responsable-caja')].map((b) => ({
      nombre: b.querySelector('.r-nombre').value.trim(), tp: b.querySelector('.r-tp').value.trim(), entidad: b.querySelector('.r-entidad').value.trim() })))));
  } else if (c.tipo === 'calculado') {
    div.innerHTML = etq + '<div class="calif" id="calc-' + c.id + '"></div>';
  }
  return div;
}

const form = $('form-ficha');
FICHA2.secciones.forEach((sec, i) => {
  const b = document.createElement('section');
  b.className = 'seccion' + (i > 0 ? ' cerrada' : '');
  b.dataset.seccion = sec.id;
  b.innerHTML = '<div class="seccion-cabeza"><span class="seccion-num">' + sec.numero + '</span><span class="seccion-titulo">' + esc(sec.titulo) + '</span>' +
    '<span class="seccion-faltan"></span><span class="seccion-flecha">&#9662;</span></div>' +
    '<div class="seccion-cuerpo">' + (sec.ayuda ? '<p class="seccion-ayuda">' + esc(sec.ayuda) + '</p>' : '') +
    '<div class="rejilla"></div><button type="button" class="btn-siguiente">Siguiente sección &rarr;</button></div>';
  b.querySelector('.seccion-cabeza').addEventListener('click', () => b.classList.toggle('cerrada'));
  const rej = b.querySelector('.rejilla');
  sec.campos.forEach((c) => rej.appendChild(dibujarCampo(Object.assign({ sec }, c))));
  b.querySelector('.btn-siguiente').addEventListener('click', () => {
    b.classList.add('cerrada');
    const sig = FICHA2.secciones.slice(i + 1).find((x) => cumple(x.soloSi));
    if (sig) { const s = form.querySelector('[data-seccion="' + sig.id + '"]'); s.classList.remove('cerrada'); s.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else $('btn-enviar-ficha').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  form.appendChild(b);
});

// ---------------------------------------------------------------- estado
const FICHA_NIV = NIVELES;
function set(id, v, sinRedibujarDetalles) { D[id] = v; pintar(sinRedibujarDetalles); }
function vacio(c) {
  const v = D[c.id];
  if (c.tipo === 'gps') return !(v && v.y && v.x);
  if (c.tipo === 'responsables') return !(v && v[0] && v[0].nombre && v[0].tp);
  if (c.tipo === 'fotos') return !v;
  return v == null || v === '' || (Array.isArray(v) && !v.length);
}
function faltantes(c) {
  const f = [];
  if (!visible(c) || c.soloLectura || c.tipo === 'calculado') return f;
  if (c.requerido && vacio(c)) f.push(c.id);
  Object.entries(c.detalles || {}).forEach(([o, d]) => { const v = D[c.id]; if ((Array.isArray(v) ? v.includes(o) : v === o) && !(D[d.id] || '').trim()) f.push(d.id); });
  if (c.tipo === 'prioridad' && D._dif) {
    if (!D.justificacion_motivo) f.push('justificacion_motivo');
    if ((D.justificacion_texto || '').trim().length < c.justificacion.minimo) f.push('justificacion_texto');
  }
  return f;
}
function pintar(sinRedibujarDetalles) {
  // visibilidad de campos y secciones (como la app: la sección que no aplica queda "omitida")
  campos.forEach((c) => { form.querySelector('[data-campo="' + c.id + '"]').hidden = !visible(c); });
  let tot = 0, listos = 0;
  FICHA2.secciones.forEach((s) => {
    const b = form.querySelector('[data-seccion="' + s.id + '"]');
    const om = !cumple(s.soloSi), sinDecidir = s.soloSi && !D.hay_movimiento;
    b.classList.toggle('omitida', om && !sinDecidir);
    let n = 0;
    s.campos.forEach((c) => { const cc = Object.assign({ sec: s }, c); if (!visible(cc) || !c.requerido || c.tipo === 'calculado' || c.soloLectura) return; tot++; if (faltantes(cc).length) n++; else listos++; });
    const t = b.querySelector('.seccion-faltan');
    t.className = 'seccion-faltan ' + (sinDecidir ? 'espera' : om ? 'omitida' : n ? 'pendiente' : 'lista');
    t.textContent = sinDecidir ? 'Según la sección 1' : om ? 'No aplica' : n ? 'Faltan ' + n : 'Completa';
  });
  $('barra-progreso-relleno').style.width = (tot ? Math.round(100 * listos / tot) : 0) + '%';
  // calificación
  const k = calcularCriticidad(D);
  D._sug = k.sugerida;
  const sug = k.sugerida || '—';
  [$('chip-top'), $('chip-sug')].forEach((ch) => { ch.textContent = sug; ch.className = 'chip ' + (FICHA_NIV.includes(sug) ? sug : 'gris'); });
  const F = k.factores || {};
  $('calc-valoracion').innerHTML = D.hay_movimiento === 'No' ? '' :
    '<table><tr><th>Factor</th><th>Base</th><th>Pts</th></tr>' +
    [['A1 Magnitud', F.A1], ['A2 Actividad', F.A2], ['A3 Indicios de reactivación', F.A3], ['A4 Velocidad esperada', F.A4]]
      .map(([n, f]) => '<tr><td>' + n + '</td><td>' + esc(f ? f.porque : '') + '</td><td>' + (f ? f.pts : 0) + '</td></tr>').join('') +
    '<tr class="tot"><td>Amenaza</td><td>' + esc(k.amenaza || '') + '</td><td>' + (k.puntos || 0) + '</td></tr>' +
    '<tr class="tot"><td>Exposición</td><td>' + esc(k.porqueExposicion || '') + '</td><td>' + (k.exposicion || 0) + ' / 4</td></tr></table>' +
    '<p class="calif-ind"><b>Indicios detectados:</b> ' + esc((k.indicios || []).join('; ') || 'ninguno') + '</p>' +
    ((k.advertencias || []).length ? '<div class="calif-adv"><b>Revise la coherencia:</b><ul>' + k.advertencias.map((a) => '<li>' + esc(a) + '</li>').join('') + '</ul></div>' : '');
  // la prioridad final sigue a la sugerida mientras el evaluador no la cambie
  if (FICHA_NIV.includes(k.sugerida) && k.sugerida !== ultimaSug) {
    if (!D.prioridad || D.prioridad === ultimaSug) { D.prioridad = k.sugerida; form.querySelectorAll('input[name=prioridad]').forEach((x) => { x.checked = x.value === k.sugerida; }); }
    ultimaSug = k.sugerida;
  }
  D._dif = FICHA_NIV.includes(k.sugerida) && D.prioridad ? FICHA_NIV.indexOf(D.prioridad) - FICHA_NIV.indexOf(k.sugerida) : 0;
  if (!sinRedibujarDetalles) { const p = form.querySelector('[data-campo="prioridad"]'); p._pintarDetalles(); }
  $('resultado').hidden = true;
  D._k = k;
}

// ---------------------------------------------------------------- finalizar (simulado) y comentarios
$('btn-enviar-ficha').addEventListener('click', () => {
  pintar();
  form.querySelectorAll('.faltante').forEach((x) => x.classList.remove('faltante'));
  const faltan = [];
  campos.forEach((c) => faltantes(c).forEach((id) => {
    faltan.push(c);
    const el = form.querySelector('[data-campo="' + id + '"]') || form.querySelector('[data-detalle="' + id + '"]');
    if (el) el.classList.add('faltante');
  }));
  if (faltan.length) {
    const primera = faltan[0];
    $('msg-validacion').textContent = 'Faltan ' + faltan.length + ' respuesta(s). La primera está en la sección ' + primera.sec.numero + '.';
    const s = form.querySelector('[data-seccion="' + primera.sec.id + '"]'); s.classList.remove('cerrada');
    form.querySelector('.faltante').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  $('msg-validacion').textContent = '';
  const k = D._k, r = $('resultado');
  r.hidden = false;
  r.innerHTML = '<b>Ficha completa (demostración).</b> En la versión real se enviaría con: prioridad sugerida <span class="chip ' + (k.sugerida || 'gris') + '">' + esc(k.sugerida) + '</span>' +
    (D.prioridad && D.prioridad !== k.sugerida ? ' · prioridad final <span class="chip ' + D.prioridad + '">' + D.prioridad + '</span> (justificada)' : '') +
    '<p style="margin:12px 0 4px"><b>¿Comentarios sobre la propuesta?</b> Escríbalos y envíelos al coordinador de la propuesta en la DIGER. Se adjunta el resumen de este caso.</p>' +
    '<textarea id="fb-texto" placeholder="Preguntas que sobran o faltan, opciones, la prioridad sugerida…"></textarea>' +
    '<div class="botones"><a class="btn-principal" id="fb-wa" target="_blank" rel="noopener" href="#">WhatsApp</a><a class="btn-secundario" id="fb-mail" href="#">Correo</a>' +
    '<button type="button" class="btn-secundario" id="fb-copiar">Copiar</button></div>';
  const msg = () => {
    const F = k.factores || {};
    const t = 'Comentarios a la propuesta de ficha de taludes 2.0\n\n' + ($('fb-texto').value.trim() || '(sin observaciones)') + '\n\nCaso de prueba: ' + (D.hay_movimiento || '') +
      (F.A1 ? '\nA1 ' + F.A1.pts + ' + A2 ' + F.A2.pts + ' + A3 ' + F.A3.pts + ' + A4 ' + F.A4.pts + ' = ' + k.puntos + ' (' + k.amenaza + ') · Exposición ' + k.exposicion : '') +
      '\nPrioridad sugerida: ' + k.sugerida + (D.prioridad ? ' · final: ' + D.prioridad : '') + (D._dif ? '\nJustificación: ' + D.justificacion_motivo + ': ' + D.justificacion_texto : '');
    $('fb-wa').href = 'https://wa.me/?text=' + encodeURIComponent(t);
    $('fb-mail').href = 'mailto:?subject=' + encodeURIComponent('Comentarios ficha de taludes 2.0') + '&body=' + encodeURIComponent(t);
    return t;
  };
  $('fb-texto').addEventListener('input', msg); msg();
  $('fb-copiar').addEventListener('click', () => { const t = msg(); if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => { $('fb-copiar').textContent = 'Copiado'; }, () => {}); });
  r.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
form.querySelector('[data-campo="fecha_hora_visita"] input').value = D.fecha_hora_visita;
pintar();
</script>
